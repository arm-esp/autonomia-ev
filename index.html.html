<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Autonomía EV · 108 kWh</title>
<style>
  :root{
    --bg:#0B1220;
    --panel:#121B2E;
    --line:#223047;
    --text:#E7ECF3;
    --muted:#8B98AE;
    --accent:#4CE0B3;
    --accent2:#3266AD;
    --warn:#D85A30;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  header{
    margin-bottom:20px;
  }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:11px;
    color:var(--accent);
    font-weight:600;
  }
  h1{
    font-size:22px;
    margin:6px 0 2px;
    font-weight:700;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
  }
  .tabs{
    display:flex;
    gap:4px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px;
    margin-bottom:16px;
  }
  .tab-btn{
    flex:1;
    padding:10px 12px;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
  }
  .tab-btn.active{
    background:var(--accent2);
    color:#fff;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }
  .field{
    margin-bottom:16px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type=number]{
    width:100%;
    padding:12px 14px;
    background:#0D1626;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-size:16px;
  }
  input[type=number]:focus{
    outline:none;
    border-color:var(--accent);
  }
  .result{
    margin-top:18px;
    padding:18px;
    background:#0D1626;
    border:1px solid var(--accent);
    border-radius:10px;
    text-align:center;
  }
  .result .km{
    font-size:36px;
    font-weight:800;
    color:var(--accent);
    line-height:1;
  }
  .result .label{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }
  .fixed-note{
    font-size:11px;
    color:var(--muted);
    margin-top:10px;
    text-align:center;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  th, td{
    padding:8px 6px;
    text-align:right;
    border-bottom:1px solid var(--line);
  }
  th:first-child, td:first-child{
    text-align:left;
  }
  th{
    color:var(--muted);
    font-weight:600;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  tr:hover td{
    background:#0D1626;
  }
  .table-wrap{
    max-height:520px;
    overflow-y:auto;
  }
  .bar-cell{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bar{
    height:6px;
    border-radius:3px;
    background:var(--accent2);
  }
  .hidden{display:none;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Batería fija · 108 kWh</div>
    <h1>Autonomía coche eléctrico</h1>
    <div class="sub">Calculadora de km según consumo (kWh/100km)</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('calc')">Calculadora</button>
    <button class="tab-btn" onclick="switchTab('table')">Tabla 12–30 kWh/100km</button>
  </div>

  <div id="calc" class="panel">
    <div class="field">
      <label for="consumo">Consumo (kWh / 100 km)</label>
      <input type="number" id="consumo" value="18" min="1" step="0.1" oninput="calcular()">
    </div>
    <div class="result">
      <div class="km" id="kmResult">600 km</div>
      <div class="label">Autonomía estimada</div>
    </div>
    <div class="fixed-note">Fórmula: 108 kWh ÷ consumo × 100</div>
  </div>

  <div id="table" class="panel hidden">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Consumo (kWh/100km)</th>
            <th>Autonomía (km)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="fixed-note">Rango de consumo típico de un EV: 12–30 kWh/100km</div>
  </div>
</div>

<script>
function switchTab(tab){
  document.getElementById('calc').classList.toggle('hidden', tab!=='calc');
  document.getElementById('table').classList.toggle('hidden', tab!=='table');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', (tab==='calc' && i===0) || (tab==='table' && i===1));
  });
}

function calcular(){
  const consumo = parseFloat(document.getElementById('consumo').value);
  const bateria = 108;
  const el = document.getElementById('kmResult');
  if(!consumo || consumo<=0){
    el.textContent = '—';
    return;
  }
  const km = (bateria / consumo) * 100;
  el.textContent = km.toFixed(0) + ' km';
}

function buildTable(){
  const bateria = 108;
  const body = document.getElementById('tableBody');
  let maxKm = (bateria / 12) * 100;
  let rows = '';
  for(let c=12; c<=30; c+=0.5){
    const km = (bateria / c) * 100;
    const pct = (km / maxKm) * 100;
    const label = Number.isInteger(c) ? c.toFixed(0) : c.toFixed(1);
    rows += `<tr>
      <td>${label}</td>
      <td>${km.toFixed(0)}</td>
      <td><div class="bar-cell"><div class="bar" style="width:${pct}px"></div></div></td>
    </tr>`;
  }
  body.innerHTML = rows;
}

calcular();
buildTable();
</script>
</body>
</html>
